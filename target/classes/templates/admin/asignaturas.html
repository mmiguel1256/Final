<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestión de Asignaturas')}"></head>
<body>

    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark"><i class="bi bi-book text-primary me-2"></i>Catálogo de Asignaturas</h2>
                <p class="text-muted">Administración y configuración de materias y asignaturas críticas</p>
            </div>
            <div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearAsignatura">
                    <i class="bi bi-plus-lg me-1"></i>Nueva Asignatura
                </button>
            </div>
        </div>

        <!-- Tabla de Asignaturas -->
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Código</th>
                                <th>Nombre de la Asignatura</th>
                                <th>Programa Académico</th>
                                <th class="text-center">Tipo / Condición</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(asignaturas)}">
                                <td colspan="4" class="text-center py-4 text-muted">
                                    No hay asignaturas registradas en el sistema.
                                </td>
                            </tr>
                            <tr th:each="asig : ${asignaturas}">
                                <td class="ps-4 fw-bold text-primary" th:text="${asig.codigo}">CALC-01</td>
                                <td class="fw-semibold" th:text="${asig.nombre}">Cálculo Diferencial</td>
                                <td th:text="${asig.programa}">Ingeniería de Sistemas</td>
                                <td class="text-center">
                                    <span th:if="${asig.critica}" class="badge bg-danger px-3 py-2">
                                        <i class="bi bi-exclamation-triangle-fill me-1"></i>Crítica
                                    </span>
                                    <span th:unless="${asig.critica}" class="badge bg-secondary px-3 py-2">
                                        Regular
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal para Crear Asignatura -->
        <div class="modal fade" id="modalCrearAsignatura" tabindex="-1" aria-labelledby="modalAsignaturaLabel" aria-hidden="true"
             th:classappend="${#fields.hasErrors('${asignaturaDto.*}')} ? 'show d-block' : ''">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalAsignaturaLabel">
                            <i class="bi bi-journal-plus me-2"></i>Registrar Nueva Asignatura
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/admin/asignaturas}" th:object="${asignaturaDto}" method="post" novalidate>
                        <div class="modal-body p-4">
                            <div class="mb-3">
                                <label for="codigo" class="form-label fw-semibold">Código de Asignatura</label>
                                <input type="text" id="codigo" th:field="*{codigo}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid' : ''"
                                       placeholder="Ej: CALC-01" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre de la Asignatura</label>
                                <input type="text" id="nombre" th:field="*{nombre}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                       placeholder="Ej: Cálculo Diferencial" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="programa" class="form-label fw-semibold">Programa Académico</label>
                                <select id="programa" th:field="*{programa}"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('programa')} ? 'is-invalid' : ''" required>
                                    <option value="">-- Seleccionar Programa --</option>
                                    <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                                    <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                                    <option value="Ingeniería Electrónica">Ingeniería Electrónica</option>
                                    <option value="Administración de Empresas">Administración de Empresas</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('programa')}" th:errors="*{programa}"></div>
                            </div>

                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" id="critica" th:field="*{critica}">
                                <label class="form-check-label fw-semibold" for="critica">
                                    Marcar como asignatura crítica (prioritaria para tutorías UTS)
                                </label>
                            </div>
                        </div>
                        <div class="modal-footer bg-light">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Guardar Asignatura
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
